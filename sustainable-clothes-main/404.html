<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening passport — Loomtrace</title></head><body><script>const parts=location.pathname.split('/').filter(Boolean);const i=parts.indexOf('p');if(i>=0&&parts[i+1]){const root='/'+parts.slice(0,i).join('/')+(i?'/':'');location.replace(root+'passport.html?slug='+encodeURIComponent(parts[i+1]))}else location.replace('./')</script><p>Opening the product passport…</p></body></html>
