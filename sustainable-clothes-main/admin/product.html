<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit product — Loomtrace</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="admin-shell"><header class="topbar"><a class="brand" href="../"><span class="brand-mark">↗</span>loomtrace</a><nav class="nav"><a href="../admin.html">Dashboard</a><button class="btn" id="logout">Log out</button></nav></header><main class="admin-main"><h1>Product and journey</h1><div id="message" role="status" aria-live="polite"></div><div class="admin-card"><p class="error">Files uploaded here are publicly visible. Do not upload private documents.</p><form id="product-form"><div class="admin-grid"><div class="field"><label for="name">Product name</label><input id="name" required></div><div class="field"><label for="sku">SKU</label><input id="sku"></div><div class="field"><label for="slug">Slug (locked after creation)</label><input id="slug" required></div><div class="field"><label for="brand">Brand name</label><input id="brand" required></div><div class="field"><label for="colorway">Colorway</label><input id="colorway"></div><div class="field"><label for="origin">Origin country</label><input id="origin"></div><div class="field"><label for="materials">Materials JSON (name and percentage)</label><textarea id="materials"></textarea></div><div class="field"><label for="certs">Certifications JSON</label><textarea id="certs"></textarea></div><div class="field"><label for="locations">Manufacturing locations JSON</label><textarea id="locations"></textarea></div><div class="field"><label for="image">Product image upload</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label for="care">Care instructions</label><textarea id="care"></textarea></div><div class="field"><label for="repair">Repair instructions</label><textarea id="repair"></textarea></div><div class="field"><label for="resale">Resale instructions</label><textarea id="resale"></textarea></div><div class="field"><label for="recycling">Recycling instructions</label><textarea id="recycling"></textarea></div><div class="field"><label><input id="published" type="checkbox"> Publish passport</label></div></div><button class="btn primary">Save product</button> <a id="public-link" target="_blank" rel="noopener noreferrer"></a></form></div><section class="admin-card"><h2>Supply-chain steps</h2><p>Editing a reviewed step returns it to submitted. Upload only public evidence.</p><div id="steps"></div><button class="btn" id="add-step">Add step</button></section></main></div><script type="module" src="../assets/js/admin.js"></script></body></html>
